<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Retrograde — a browser-native retro OS shell">
  <title>Retrograde — a browser-native retro OS shell</title>
  <defs>
    <style>
      /* Tüm vurgu rengi currentColor'dan akar: amber → green → blue → white (uygulamadaki 4 tema) */
      .root { color: #ffb000; animation: accent 24s ease-in-out infinite; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .screen { transform-box: fill-box; transform-origin: center; animation: crt-on 1.1s cubic-bezier(.2,.8,.2,1) both; }
      .title { animation: flicker 7s linear infinite; }
      .ghost-r, .ghost-c { opacity: 0; animation: glitch 7s steps(1) infinite; }
      .ghost-c { animation-name: glitch-c; }
      .cursor { animation: blink 1s steps(1) infinite; }
      .pwr { animation: pulse 2.4s ease-in-out infinite; }
      .roll { animation: roll 6s linear infinite; }
      .key { transform-box: fill-box; transform-origin: center; animation: lit 9s ease-in-out infinite; }
      @keyframes accent {
        0%, 20% { color: #ffb000; } 25%, 45% { color: #33e86c; }
        50%, 70% { color: #4aa3ff; } 75%, 95% { color: #e8ecf0; } 100% { color: #ffb000; }
      }
      @keyframes crt-on {
        0% { transform: scale(.7, .004); opacity: 0; }
        30% { transform: scale(1, .004); opacity: 1; }
        100% { transform: scale(1, 1); opacity: 1; }
      }
      @keyframes flicker {
        0%, 41%, 43%, 45%, 78%, 79.2%, 100% { opacity: 1; }
        42% { opacity: .55; } 44% { opacity: .8; } 78.6% { opacity: .62; }
      }
      @keyframes glitch {
        0%, 100% { opacity: 0; transform: translate(0, 0); }
        42% { opacity: .75; transform: translate(-7px, 0); }
        43% { opacity: .5; transform: translate(4px, -2px); }
        45% { opacity: 0; transform: translate(0, 0); }
      }
      @keyframes glitch-c {
        0%, 100% { opacity: 0; transform: translate(0, 0); }
        42% { opacity: .75; transform: translate(7px, 0); }
        43% { opacity: .5; transform: translate(-4px, 2px); }
        45% { opacity: 0; transform: translate(0, 0); }
      }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
      @keyframes roll { from { transform: translateY(-120px); } to { transform: translateY(440px); } }
      @keyframes lit {
        0%, 10%, 100% { transform: translateY(0); }
        4% { transform: translateY(-6px); }
      }
      .key .hl { opacity: 0; animation: hl 9s ease-in-out infinite; }
      @keyframes hl { 0%, 10%, 100% { opacity: 0; } 4% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .sub { clip-path: none; }
        .cursor-bar { display: none; }
      }
    </style>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="currentColor" stop-opacity=".2" />
      <stop offset=".55" stop-color="currentColor" stop-opacity=".04" />
      <stop offset="1" stop-color="currentColor" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset=".55" stop-color="#000" stop-opacity="0" />
      <stop offset="1" stop-color="#000" stop-opacity=".75" />
    </radialGradient>
    <linearGradient id="rollbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset=".5" stop-color="#fff" stop-opacity=".05" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#fff" fill-opacity=".05" />
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity=".32" />
    </pattern>
    <filter id="bloom" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="soft" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="420" rx="18" /></clipPath>
    <!-- Alt başlık "lazer yazımı": SMIL ile genişleyen klip (Safari'de de çalışır) -->
    <clipPath id="type">
      <rect x="150" y="244" height="36" width="0">
        <animate attributeName="width" values="0;0;900;900;0" keyTimes="0;.08;.36;.93;1" dur="10s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <g class="root" clip-path="url(#frame)">
    <rect width="1200" height="420" fill="#050506" />
    <g class="screen">
      <rect width="1200" height="420" fill="url(#glow)" />
      <rect width="1200" height="420" fill="url(#dots)" />

      <!-- üst durum çubuğu -->
      <text class="mono" x="40" y="44" font-size="12" letter-spacing="3" fill="#5a5850">RETROGRADE SYSTEMS 5100 · PHOSPHOR BIOS v2.0</text>
      <circle class="pwr" cx="1102" cy="40" r="4" fill="currentColor" filter="url(#soft)" />
      <text class="mono" x="1114" y="44" font-size="12" letter-spacing="3" fill="#5a5850">PWR</text>
      <line x1="40" y1="62" x2="1160" y2="62" stroke="#fff" stroke-opacity=".06" />

      <!-- başlık: kromatik hayaletler + fosfor bloom -->
      <g class="mono" font-size="112" font-weight="800" text-anchor="middle">
        <text class="ghost-r" x="600" y="212" textLength="860" lengthAdjust="spacingAndGlyphs" fill="#ff3b6b">RETROGRADE</text>
        <text class="ghost-c" x="600" y="212" textLength="860" lengthAdjust="spacingAndGlyphs" fill="#3be8ff">RETROGRADE</text>
        <text class="title" x="600" y="212" textLength="860" lengthAdjust="spacingAndGlyphs" fill="currentColor" filter="url(#bloom)">RETROGRADE</text>
      </g>

      <!-- alt başlık -->
      <text class="mono sub" x="150" y="270" font-size="20" textLength="900" lengthAdjust="spacingAndGlyphs" fill="#ece8de" fill-opacity=".86" clip-path="url(#type)">a browser-native retro OS shell · real x86 emulation · zero tracking</text>
      <rect class="cursor-bar" y="250" width="3" height="26" fill="currentColor" filter="url(#soft)">
        <animate attributeName="x" values="150;150;1050;1050;150" keyTimes="0;.08;.36;.93;1" dur="10s" repeatCount="indefinite" />
      </rect>

      <!-- dock: uygulama glifleri sırayla yanar -->
      <rect x="330" y="318" width="540" height="64" rx="16" fill="#0c0c10" stroke="#fff" stroke-opacity=".07" />
      <g class="mono" font-size="18" text-anchor="middle" fill="#ece8de">
        <g class="key" style="animation-delay:0s"><rect x="346" y="328" width="44" height="44" rx="10" fill="#15151b" stroke="#24242c" /><rect class="hl" x="346" y="328" width="44" height="44" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" style="animation-delay:0s" /><text x="368" y="356">◈</text></g>
        <g class="key" style="animation-delay:1s"><rect x="402" y="328" width="44" height="44" rx="10" fill="#15151b" stroke="#24242c" /><rect class="hl" x="402" y="328" width="44" height="44" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" style="animation-delay:1s" /><text x="424" y="356">&gt;_</text></g>
        <g class="key" style="animation-delay:2s"><rect x="458" y="328" width="44" height="44" rx="10" fill="#15151b" stroke="#24242c" /><rect class="hl" x="458" y="328" width="44" height="44" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" style="animation-delay:2s" /><text x="480" y="356">▱</text></g>
        <g class="key" style="animation-delay:3s"><rect x="514" y="328" width="44" height="44" rx="10" fill="#15151b" stroke="#24242c" /><rect class="hl" x="514" y="328" width="44" height="44" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" style="animation-delay:3s" /><text x="536" y="356">▤</text></g>
        <g class="key" style="animation-delay:4s"><rect x="570" y="328" width="44" height="44" rx="10" fill="#15151b" stroke="#24242c" /><rect class="hl" x="570" y="328" width="44" height="44" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" style="animation-delay:4s" /><text x="592" y="356">▦</text></g>
        <g class="key" style="animation-delay:5s"><rect x="626" y="328" width="44" height="44" rx="10" fill="#15151b" stroke="#24242c" /><rect class="hl" x="626" y="328" width="44" height="44" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" style="animation-delay:5s" /><text x="648" y="356">✦</text></g>
        <g class="key" style="animation-delay:6s"><rect x="682" y="328" width="44" height="44" rx="10" fill="#15151b" stroke="#24242c" /><rect class="hl" x="682" y="328" width="44" height="44" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" style="animation-delay:6s" /><text x="704" y="356">✎</text></g>
        <g class="key" style="animation-delay:7s"><rect x="738" y="328" width="44" height="44" rx="10" fill="#15151b" stroke="#24242c" /><rect class="hl" x="738" y="328" width="44" height="44" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" style="animation-delay:7s" /><text x="760" y="356">▨</text></g>
        <g class="key" style="animation-delay:8s"><rect x="794" y="328" width="44" height="44" rx="10" fill="#15151b" stroke="#24242c" /><rect class="hl" x="794" y="328" width="44" height="44" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" style="animation-delay:8s" /><text x="816" y="356">=</text></g>
      </g>
    </g>

    <!-- CRT katmanları -->
    <rect class="roll" width="1200" height="120" fill="url(#rollbar)" />
    <rect width="1200" height="420" fill="url(#scan)" />
    <rect width="1200" height="420" fill="url(#vignette)" />
    <rect x=".5" y=".5" width="1199" height="419" rx="18" fill="none" stroke="#fff" stroke-opacity=".08" />
  </g>
</svg>
